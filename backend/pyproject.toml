[project]
name = "fasalsaakshi"
version = "0.1.0"
description = "Farmer-side satellite crop-loss witness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "tenacity>=9.0",
  "langgraph>=0.2",
  "google-genai>=1.0",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "odc-stac>=0.3.10",
  "rioxarray>=0.17",
  "rasterio>=1.3.10",
  "numpy>=1.26",
  "scipy>=1.13",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pillow>=10.4",
  "matplotlib>=3.9",
  "weasyprint>=62",
  "jinja2>=3.1",
  "qrcode>=7.4",
  "rank-bm25>=0.2.2",
  "pypdf>=4.3",
  "apscheduler>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls real external APIs"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
